name: CI

# Third-party actions are pinned to a full commit SHA rather than a mutable
# tag. A tag can be repointed at new code by the action's owner (or anyone who
# compromises that account), and here it would inherit ANTHROPIC_API_KEY,
# pull-requests: write, and OIDC-minting rights. The trailing comment records
# the human-readable version the SHA corresponds to; bump both together.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Primary suite: the project's default Ruby. Keep this in sync with
  # .ruby-version, which is what local version managers read.
  test-ruby-4:
    name: Test (Ruby 4.0.6, default)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: '4.0.6'
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop

    - name: Run RSpec tests
      run: bundle exec rspec

  # Compatibility floor: the oldest Ruby the gemspec still supports (>= 3.3.0).
  test-ruby-3-3:
    name: Test (Ruby 3.3, floor)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop

    - name: Run RSpec tests
      run: bundle exec rspec

  code-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
    - uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1.0.211
      env:
        # The repo's ANTHROPIC_API_KEY is an identity-linked key; the API requires
        # the anthropic-workspace-id header on every request for such keys.
        ANTHROPIC_CUSTOM_HEADERS: "anthropic-workspace-id: wrkspc_01LSrT7tFuppN7RCBZqHox3v"
      with:
        prompt: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          Review the PR changes. Focus on code quality, potential bugs, performance and security issues.
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        claude_args: "--model claude-opus-5"
